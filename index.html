<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alessia Di Giulio — A Journey in Stamps</title>
<meta name="description" content="Alessia Di Giulio's career and education journey — an interactive digital travel journal.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<!-- PROGRESS STAMPS (fixed) -->
<nav class="progress-nav" id="progress-nav" aria-label="Journey progress"></nav>

<!-- COVER -->
<section class="cover" id="cover">
  <div class="cover-frame">
    <p class="cover-eyebrow">Passport No. 2026 · Marketing &amp; Social Media</p>
    <h1 class="cover-name">Alessia<br>Di Giulio</h1>
    <p class="cover-tagline" id="cover-tagline"></p>
    <button class="cover-cta" id="begin-journey">Begin the Journey <span class="arrow">→</span></button>
  </div>
  <div class="cover-border" aria-hidden="true"></div>
</section>

<!-- FLIGHT MAP -->
<section class="flight-section" id="flight-section">
  <p class="flight-caption">Tap the arrow below to fly to the next stop</p>
  <div id="flight-map"></div>
</section>

<!-- CHAPTERS render here via script.js -->
<main id="chapters-root"></main>

<!-- FIXED BOTTOM FLIGHT CONTROL -->
<div class="flight-dock" id="flight-dock" hidden>
  <button class="advance-btn" id="advance-btn" aria-label="Fly to next stop">
    <span class="advance-plane">✈</span>
    <span class="advance-label" id="advance-label">Next Stop</span>
  </button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js?v=5"></script>
<script src="script.js?v=6"></script>
</body>
</html>
